name: Thaw
options:
  bundleIdPrefix: com.tinkercademy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  Thaw:
    type: application
    platform: iOS
    sources:
      - path: Thaw
    info:
      path: Thaw-Info.plist
      properties:
        CFBundleDisplayName: Thaw
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkercademy.thaw
        INFOPLIST_FILE: Thaw-Info.plist
        GENERATE_INFOPLIST_FILE: NO
  ThawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThawTests
    dependencies:
      - target: Thaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Thaw:
    build:
      targets:
        Thaw: all
        ThawTests: [test, analyze]
    test:
      targets:
        - ThawTests
