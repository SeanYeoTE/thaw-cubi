name: Thaw
options:
  bundleIdPrefix: com.tinkercademy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: X8UMDPWY6A
    CODE_SIGN_STYLE: Automatic
targets:
  Thaw:
    type: application
    platform: iOS
    sources:
      - path: Thaw
        excludes:
          - Thaw.entitlements
    dependencies:
      - target: ThawShare
        embed: true
    entitlements:
      path: Thaw/Thaw.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tinkercademy.thaw
    info:
      path: Thaw-Info.plist
      properties:
        CFBundleDisplayName: Thaw
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkercademy.thaw
        INFOPLIST_FILE: Thaw-Info.plist
        GENERATE_INFOPLIST_FILE: NO
  ThawShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ThawShare
        excludes:
          - ThawShare.entitlements
      - path: Thaw/DesignSystem
      - path: Thaw/Models
      - path: Thaw/Services/ShareInbox.swift
      - path: Thaw/Services/Formatting.swift
      - path: Thaw/Features/AddWant/AddWantContracts.swift
      - path: Thaw/Features/AddWant/AddWantPresenter.swift
      - path: Thaw/Features/AddWant/AddWantViewController.swift
      - path: Thaw/Features/Shared/MomentView.swift
      - path: Thaw/Features/Shared/AdaptiveViews.swift
      - path: Thaw/Features/Shared/ShareItemParser.swift
      - path: Thaw/Resources/Fonts/BricolageGrotesque-ExtraBold.ttf
    entitlements:
      path: ThawShare/ThawShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tinkercademy.thaw
    info:
      path: ThawShare/Info.plist
      properties:
        CFBundleDisplayName: Thaw
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkercademy.thaw.share
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  ThawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThawTests
    dependencies:
      - target: Thaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  ThawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ThawUITests
    dependencies:
      - target: Thaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Thaw:
    build:
      targets:
        Thaw: all
        ThawTests: [test, analyze]
    test:
      targets:
        - ThawTests
        - ThawUITests
